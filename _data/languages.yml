  home:
    about: "About Me"
    intro: 'I’m Jiarui Han (pronounced: JEE-ah-ray HAHN), a second-year Master’s student at the School of Computer Science and Technology of Tongji University. I study in the <a href="https://admis-tongji.github.io/">ADMIS Lab</a> under the supervision of <a href="https://cs.tongji.edu.cn/info/1065/3472.htm">Prof. Jihong Guan</a> and <a href="https://faculty.tongji.edu.cn/liwengen/zh_CN/index/96065/list/index.htm">Assoc. Prof. Wengen Li</a>. My research interests center on <strong>multimodal retrieval</strong>, particularly <strong>interactive cross-modal retrieval</strong> and applications of multimodal RA in <strong>industrial settings</strong>. Prior to this, I earned my Bachelor of Engineering degree from the School of Software Engineering at Tongji University.'
    contact: "Contact Me"
    address_label: "Address"
    address: "4800 Cao’an Highway, Shanghai, P.R. China 201804"

