    intro: 'Hallo, ich bin Jiarui Han (ausgesprochen: JEE-ah-ray HAHN) und studiere im zweiten Jahr des Masterstudiengangs an der Fakultät für Informatik und Technologie der Tongji-Universität. Ich arbeite im <a href="https://admis-tongji.github.io/">ADMIS Lab</a> unter der Betreuung von <a href="https://cs.tongji.edu.cn/info/1065/3472.htm">Prof. Jihong Guan</a> und <a href="https://faculty.tongji.edu.cn/liwengen/zh_CN/index/96065/list/index.htm">Prof. Wengen Li</a>. Meine Forschungsinteressen liegen im Bereich der <strong>multimodalen Suche</strong>, insbesondere der <strong>interaktiven modalitätsübergreifenden Suche</strong> und der Anwendung multimodaler RA in <strong>industriellen Szenarien</strong>. Zuvor erwarb ich meinen Bachelor of Engineering an der Fakultät für Software Engineering der Tongji-Universität.'
