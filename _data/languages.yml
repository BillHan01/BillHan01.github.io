    intro: 'Hallo, ich bin Jiarui Han (ausgesprochen: JEE-ah-ray HAHN) und studiere im ersten Jahr des Masterstudiengangs an der Fakultät für Informatik und Technologie der Tongji-Universität. Ich arbeite im <a href="https://admis-tongji.github.io/">ADMIS Lab</a> unter der Betreuung von <a href="https://cs.tongji.edu.cn/info/1061/2814.htm">Prof. Jihong Guan</a> und <a href="https://cs.tongji.edu.cn/info/1063/2826.htm">Prof. Wengen Li</a>. Meine Forschungsinteressen liegen im Bereich des <strong>multimodalen Lernens</strong>, insbesondere bei der <strong>modalitätsübergreifenden Datenausrichtung</strong> und deren Anwendung in der <strong>Fernerkundung</strong>. Zuvor erwarb ich meinen Bachelor of Engineering an der Fakultät für Software Engineering der Tongji-Universität.'
