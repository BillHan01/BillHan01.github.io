    intro: '我是韩嘉睿（英文名发音：JEE-ah-ray HAHN），现于同济大学计算机科学与技术学院攻读硕士学位。我在 <a href="https://admis-tongji.github.io/">ADMIS 实验室</a>，导师为<a href="https://cs.tongji.edu.cn/info/1065/3472.htm">关佶红教授</a>和<a href="https://faculty.tongji.edu.cn/liwengen/zh_CN/index/96065/list/index.htm">李文根副教授</a>。我的研究兴趣主要集中在<strong>多模态检索</strong>，尤其关注<strong>交互式检索</strong>及<strong>多模态 RAG 在工业场景的应用</strong>。在此之前，我于同济大学取得工学学士学位。'
