  home:
    about: "About Me"
    intro: 'Hi, I’m Jiarui Han (pronounced: JEE-ah-ray HAHN), a first-year Master’s student at the School of Computer Science and Technology of Tongji University. I work in the <a href="https://admis-tongji.github.io/">ADMIS Lab</a> under the supervision of <a href="https://cs.tongji.edu.cn/info/1061/2814.htm">Prof. Jihong Guan</a> and <a href="https://cs.tongji.edu.cn/info/1063/2826.htm">Assoc. Prof. Wengen Li</a>. My research interests broadly lie in <strong>multimodal learning</strong>, with a particular focus on <strong>cross-modal data alignment</strong> and its applications in the <strong>remote sensing</strong> domain. Prior to this, I earned my Bachelor of Engineering degree from the School of Software Engineering at Tongji University.'
    contact: "Contact Me"
    address_label: "Address"
    address: "4800 Cao’an Highway, Shanghai, P.R. China 201804"

